<body>
    <main class="container my-5">
    <h1 class="fw-bold text-center mb-4">Book Your Tickets</h1>
    <form action="submit_booking.php" method="POST">
        <div class="row">
            <!-- Left Column: Booker Details -->
            <div class="col-md-6">
                <h3 class="mb-3">Booker Details</h3>
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="mb-3">
                    <label for="event" class="form-label">Select Event</label>
                    <select class="form-select" id="event" name="event" required>
                        <option value="spain">Formula 1 Grand Premio de España</option>
                        <option value="azerbaijan">Formula 1 Azerbaijan Grand Prix</option>
                        <option value="singapore">Formula 1 Singapore Grand Prix</option>
                        <option value="united_states">Formula 1 United States Grand Prix</option>
                        <option value="mexico">Formula 1 Mexico Grand Prix</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="tickets" class="form-label">Number of Tickets</label>
                    <input type="number" class="form-control" id="tickets" name="tickets" min="1" max="10" required>
                </div>
            </div>

            <!-- Right Column: Payment Details -->
            <div class="col-md-6">
                <h3 class="mb-3">Payment Details</h3>
                <div class="mb-3">
                    <label for="card-number" class="form-label">Card Number</label>
                    <input type="text" class="form-control" id="card-number" placeholder="1234 5678 9012 3456" maxlength="19" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="expiry-date" class="form-label">Expiry Date</label>
                        <input type="text" class="form-control" id="expiry-date" placeholder="MM/YY" maxlength="5" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="cvv" class="form-label">CVV</label>
                        <input type="text" class="form-control" id="cvv" placeholder="123" maxlength="3" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="cardholder-name" class="form-label">Cardholder Name</label>
                    <input type="text" class="form-control" id="cardholder-name" placeholder="John Doe" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Payment Method</label>
                    <div class="d-flex justify-content-between">
                        <div class="form-check me-3">
                            <input class="form-check-input" type="radio" name="payment" id="creditCard" value="credit_card" required>
                            <label class="form-check-label" for="creditCard">Credit Card</label>
                        </div>
                        <div class="form-check me-3">
                            <input class="form-check-input" type="radio" name="payment" id="paypal" value="paypal" required>
                            <label class="form-check-label" for="paypal">PayPal</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="payment" id="bankTransfer" value="bank_transfer" required>
                            <label class="form-check-label" for="bankTransfer">Bank Transfer</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-center mt-4">
        <button type="submit" class="btn" style="background-color: red">Book Now</button>
        </div>
    </form>
</main>
